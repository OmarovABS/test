services:
  - type: web
    name: premium-food-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG_MODE
        value: "True"
      - key: DATABASE_PATH
        value: delivery.db
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: RESTAURANT_NAME
        value: Premium Food
