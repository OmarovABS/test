services:
  - type: web
    name: premium-food-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG_MODE
        value: "False"
      - key: SKIP_AUTH_CHECK
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: premium-food-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_PANEL_PASSWORD
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: RESTAURANT_NAME
        value: Premium Food

databases:
  - name: premium-food-db
    plan: free
    databaseName: premium_food
    user: premium_food
