services:
  - type: web
    name: premium-food-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG_MODE
        value: "False"
      - key: DATABASE_PATH
        value: delivery.db

  - type: worker
    name: premium-food-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG_MODE
        value: "False"
      - key: DATABASE_PATH
        value: delivery.db
